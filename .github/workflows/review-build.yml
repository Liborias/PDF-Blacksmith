name: Blacksmith review EXE
on:
  pull_request:
    types: [opened]
    branches: [codex/ui-palette-v6]
  push:
    branches: [chatgpt/ui-review]
    paths:
      - docs/pracovni/chatgpt/BUILD_REQUEST.txt
permissions:
  contents: read
concurrency:
  group: blacksmith-review-exe
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/ui-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip curl binutils xz-utils inkscape
      - name: Go unit tests
        run: go test ./...
      - name: Compile Windows x64 review executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-output
          sha="$(git rev-parse HEAD)"
          name="PDFBlacksmith-review-${sha:0:12}.exe"
          bash build.sh "review-output/$name"
          (
            cd review-output
            sha256sum "$name" > SHA256SUMS.txt
            printf 'Source commit: %s\nBuild run: %s\n' "$sha" "$GITHUB_RUN_ID" > BUILD_INFO.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: PDFBlacksmith-review-${{ github.run_id }}
          path: review-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
